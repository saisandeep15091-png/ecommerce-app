
apiVersion: apps/v1
kind: Deployment

metadata:
  name: ecommerce-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ecommerce-backend

  template:
    metadata:
      labels:
        app: ecommerce-backend

    spec:
      containers:
        - name: backend
          image: ghcr.io/saisandeep15091-png/ecommerce-backend:latest
          ports:
            - containerPort: 5000

